<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Reg Form</title>
</head>
<body>
    <center>
        <h1>Online Course Registration Form</h1>
        <form>
        <table>
            <tr>
                <th>
                    <label for="name">Name</label>
                </th>
                <td>
                    <input id="name" type="text" placeholder="Enter Your Name">
                </td>
            </tr>
            <tr>
                <th>
                    <label for="email">Email</label>
                </th>
                <td>
                    <input id="email" type="email" placeholder="Enter Your Email">
                </td>
            </tr>
            <tr>
                <th>
                    <label for="class">Qualification</label>
                </th>
                <td>
                <select>
                <optgroup label="Engineering">
                    <option value="B.Tech">B.Tech</option>
                    <option value="Mech">Mech</option>
                    <option value="Civil">Civil</option>
                    <option value="EEE">EEE</option>
                    <option value="B.E">B.E</option>
                </optgroup>
                <optgroup label="Arts">
                     <option value="B.SC">B.SC</option>
                     <option value="M.SC">M.SC</option>
                </optgroup>
                </select>
                </td>
            </tr>
            <tr>
                <th>
                    <label for="course">Select Course</label>
                </th>
                <td>
                    <select>
                        <option value="full stack">Full Stack</option>
                        <option value="aws">Aws</option>
                        <option value="data science">Data Science</option>
                        <option value="data analytics">Data Analytics</option>
                        <option value="ui/ux">Ui/Ux</option>
                        <option value="digital marketing">Digital Marketing</option>
                        <option value="docker">Docker</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>
                    <label for="education">Mode Of Education</label>
                </th>
                <td>
                    <input type="radio" name="education" value="online">Online <input type="radio" name="education" value="offline">Offline
                </td>
            </tr>
            <tr>
                <td style="text-align: center;">
                    <input type="submit">
                </td>
            </tr>
       
    </center>
</body>
</html>
